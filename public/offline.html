<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f3f5">
  <title>Sem conexão — Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: #f1f3f5;
      color: #14171a;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-align: center;
    }
    main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
    p { font-size: 16px; line-height: 1.5; color: #5f6670; }
    button {
      margin-top: 8px;
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 22px;
      background: #002366;
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #00a845; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Seus dados ficam guardados com segurança no servidor. Assim que a conexão voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
